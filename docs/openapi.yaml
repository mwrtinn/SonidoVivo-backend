openapi: 3.0.3
info:
  title: API Sonido Vivo
  version: 1.0.0
  description: >
    API REST del proyecto semestral Sonido Vivo (DSY1104). Autenticación con JWT
    (Authorization: Bearer token). Todos los datos de los ejemplos son ficticios.
servers:
  - url: http://localhost:3000/api/v1
    description: Entorno local
tags:
  - name: Salud
  - name: Autenticación
  - name: Usuarios
paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado del servicio
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registra un usuario. El rol inicial siempre es Cliente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '409':
          $ref: '#/components/responses/Conflicto'
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión y entrega un JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Acceso correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          description: Credenciales inválidas (mensaje genérico, no revela si la cuenta existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      tags: [Autenticación]
      summary: Datos del usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /usuarios:
    get:
      tags: [Usuarios]
      summary: Lista los usuarios (solo Administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
  /usuarios/{id}:
    patch:
      tags: [Usuarios]
      summary: Modifica un usuario. Cada persona edita solo su nombre; el Administrador también el rol y el estado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuarioRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/Validacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
    delete:
      tags: [Usuarios]
      summary: Desactiva un usuario (borrado lógico, solo Administrador)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdUsuario'
      responses:
        '204':
          description: Usuario desactivado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/SinPermiso'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdUsuario:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        example: 1
  schemas:
    RegistroRequest:
      type: object
      required: [nombre, email, clave]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Prueba
        email:
          type: string
          format: email
          maxLength: 150
          example: ana@ejemplo.cl
        clave:
          type: string
          minLength: 8
          maxLength: 128
          example: Clave12345
    LoginRequest:
      type: object
      required: [email, clave]
      properties:
        email:
          type: string
          format: email
          example: ana@ejemplo.cl
        clave:
          type: string
          example: Clave12345
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT firmado (HS256)
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 1h
    ActualizarUsuarioRequest:
      type: object
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        rol:
          type: string
          enum: [Administrador, Vendedor, Cliente]
          description: Solo lo puede enviar el Administrador
        activo:
          type: boolean
          description: Solo lo puede enviar el Administrador
    Usuario:
      type: object
      description: Nunca incluye la contraseña ni su hash
      properties:
        id_usuario:
          type: integer
          example: 1
        nombre:
          type: string
          example: Ana Prueba
        email:
          type: string
          example: ana@ejemplo.cl
        rol:
          type: string
          example: Cliente
        activo:
          type: boolean
          example: true
        fecha_registro:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        mensaje:
          type: string
        detalles:
          type: array
          items:
            type: string
  responses:
    Validacion:
      description: Datos inválidos o identificador mal formado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Token ausente, alterado o vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SinPermiso:
      description: El rol o la propiedad del recurso no alcanzan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Conflicto con una restricción (email repetido, desactivarse a sí mismo)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
